<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JOMO Social Studio</title>
<meta name="description" content="What the JOMO social media team has made: threads, captions, visuals and downloads.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="media/logos/jomo-logo.png">
<link rel="stylesheet" href="styles.css">
<script src="vendor/marked.min.js" defer></script>
<script src="vendor/purify.min.js" defer></script>
<script src="vendor/jszip.min.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <button class="icon-btn" id="menu" aria-label="Posts"><svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <a class="brand" href="#/"><img src="media/logos/jomo-logo.png" alt=""><span>Social Studio</span></a>
    <nav class="tabs" id="nav">
      <a href="#/" data-route="home">Overview</a>
      <a href="#/posts" data-route="post">Posts</a>
      <a href="#/plans" data-route="plan">Plans</a>
      <a href="#/calendar" data-route="calendar">Calendar</a>
    </nav>
    <div class="bar-right">
      <label class="search"><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Search" autocomplete="off"></label>
      <button class="icon-btn" id="theme" aria-label="Toggle dark mode"><svg viewBox="0 0 20 20"><path d="M10 2.5a7.5 7.5 0 1 0 7.5 7.5A6 6 0 0 1 10 2.5z" fill="currentColor"/></svg></button>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
  <aside class="inspector" id="inspector"></aside>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main">
  <a href="#/" data-route="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Overview</span></a>
  <a href="#/posts" data-route="post"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v10H9l-4 4z"/></svg><span>Posts</span></a>
  <a href="#/plans" data-route="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></svg><span>Plans</span></a>
  <a href="#/calendar" data-route="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Calendar</span></a>
</nav>
<div class="scrim" id="scrim"></div>
<div class="lightbox" id="lightbox" hidden><button class="close" aria-label="Close">×</button><div class="lb-body"></div></div>
<div class="toast" id="toast" hidden></div>
</body>
</html>

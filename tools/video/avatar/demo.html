<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url('file:///home/user/jomo-social/tools/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2')}
@font-face{font-family:Lato;font-weight:700;src:url('file:///home/user/jomo-social/tools/node_modules/@fontsource/lato/files/lato-latin-700-normal.woff2')}
@font-face{font-family:Lato;font-weight:900;src:url('file:///home/user/jomo-social/tools/node_modules/@fontsource/lato/files/lato-latin-900-normal.woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#F4F6EC;font-family:Lato;color:#1E2220}
.abs{position:absolute}
.label{font-weight:900;font-size:30px;letter-spacing:.22em;text-transform:uppercase;color:#77962A}
.h{font-family:Anton;text-transform:uppercase;line-height:.98;font-size:128px}
.acc{color:#77962A}
.bub{border-radius:40px;padding:34px 40px;font-weight:700;font-size:46px;line-height:1.25;transform-origin:20% 100%}
.who{display:block;font-size:24px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-bottom:10px}
.tail{position:absolute;bottom:-30px;width:0;height:0;border:18px solid transparent}
img{display:block}
</style></head><body>
<div id="lab" class="abs label" style="left:90px;top:220px">Source, please</div>
<div id="h1" class="abs h" style="left:90px;top:280px;width:900px">Burning refuse:<br><span class="acc">clean fix or<br>smoke trap?</span></div>
<div id="b1" class="abs bub" style="left:90px;top:700px;width:520px;background:#A5CD39"><span class="who">Tobi</span><span id="t1"></span><div class="tail" style="left:80px;border-top:32px solid #A5CD39;border-left:24px solid #A5CD39"></div></div>
<div id="b2" class="abs bub" style="right:90px;top:900px;width:360px;background:#1E2220;color:#F4F6EC;transform-origin:80% 100%"><span class="who" style="color:#A5CD39">Amara</span><span id="t2"></span><div class="tail" style="right:80px;border-top:32px solid #1E2220;border-right:24px solid #1E2220"></div></div>
<img id="tobi" class="abs" src="file:///home/user/jomo-social/assets/avatars/cutouts/tobi-cutout-trim.png" style="left:60px;top:1080px;height:520px;transform-origin:50% 100%">
<img id="amara" class="abs" src="file:///home/user/jomo-social/assets/avatars/cutouts/amara-cutout-trim.png" style="right:110px;top:1130px;height:470px;transform-origin:50% 100%">
<div id="end" class="abs h" style="left:90px;top:1210px;width:900px;font-size:0px"></div>
<div id="disc" class="abs" style="left:0;right:0;top:1625px;text-align:center;font-size:26px;font-weight:700;opacity:.6">Tobi and Amara are JOMO's AI characters</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const T1="My uncle says burning the refuse heap is the cleanest way to clear it.";
const T2="Source, please.";
window.render=t=>{
  const a=ease((t-0.1)/0.5); $('lab').style.opacity=a; $('lab').style.transform='translateY('+(30*(1-a))+'px)';
  const b=ease((t-0.3)/0.6); $('h1').style.opacity=b; $('h1').style.transform='translateY('+(60*(1-b))+'px)';
  // Tobi walks in from the left with a step bounce, then idles
  const ti=ease((t-0.7)/0.9); const step=t<1.6?Math.abs(Math.sin(t*14))*18*(1-ti):0;
  const idle=Math.sin(t*3.2)*6;
  const surprised=(t>4.4&&t<5.0)?Math.sin((t-4.4)/0.6*Math.PI):0;
  $('tobi').style.transform='translate('+(-700*(1-ti))+'px,'+(-step+idle)+'px) scale('+(1+0.04*surprised)+','+(1-0.05*surprised)+')';
  // Tobi's bubble pops and types
  const p1=back((t-1.5)/0.4); $('b1').style.transform='scale('+p1+')'; $('b1').style.opacity=cl((t-1.5)/0.15);
  $('t1').textContent=T1.slice(0,Math.floor(cl((t-1.7)/1.6)*T1.length));
  // Amara slides in from the right, sways, taps her tablet
  const ai=ease((t-3.3)/0.7); const sway=Math.sin(t*2.4)*1.2;
  $('amara').style.transform='translateX('+(700*(1-ai))+'px) rotate('+sway+'deg) translateY('+(Math.sin(t*2.4+1)*4)+'px)';
  const p2=back((t-4.1)/0.35); $('b2').style.transform='scale('+p2+')'; $('b2').style.opacity=cl((t-4.1)/0.15);
  $('t2').textContent=T2.slice(0,Math.floor(cl((t-4.25)/0.5)*T2.length));
  $('disc').style.opacity=0.6*ease((t-5.5)/0.6);
};
render(0);
</script></body></html>
